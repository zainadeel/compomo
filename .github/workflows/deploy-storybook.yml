name: Deploy Storybook to GitHub Pages

on:
  workflow_call:
    inputs:
      ref:
        description: Git tag or SHA to build and deploy (defaults to the triggering commit)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or SHA to build and deploy (optional — defaults to main)
        required: false
        type: string

permissions:
  contents: read

# Only one deployment at a time; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only this job deploys, so only it gets Pages and OIDC write access.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    # ~2 min build plus up to three 5-minute deploy attempts and two retry waits.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Build Stencil library
        run: npm run build

      - name: Build Storybook
        run: npx storybook build --output-dir storybook-static
        env:
          # GitHub Pages project sites live at /RepoName/ — Storybook
          # needs this so all asset paths resolve correctly.
          STORYBOOK_BASE_URL: /compomo/

      - name: Build component registry
        run: npm run registry:build

      - name: Copy registry into Storybook output
        run: cp -r public/r storybook-static/r

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

      # Retry only the promote step on transient Pages API failures (e.g.
      # "Deployment failed, try again later."). Native steps keep every
      # executed action pinned to a commit SHA.
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      - name: Wait before final retry
        if: steps.deploy2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry 2)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
