name: Deploy Storybook to GitHub Pages

on:
  workflow_call:
    inputs:
      ref:
        description: Git tag or SHA to build and deploy (defaults to the triggering commit)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or SHA to build and deploy (optional — defaults to main)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      # Keep setup inline so recovery works for tags predating the local setup action.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Select pinned npm
        shell: bash
        run: |
          npm_version="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { packageManager } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const match = /^npm@(\d+\.\d+\.\d+)$/.exec(packageManager ?? '');
          if (!match) throw new Error('packageManager must pin an exact npm version');
          process.stdout.write(match[1]);
          NODE
          )"
          if [ "$(npm --version)" != "$npm_version" ]; then
            npm install --global "npm@$npm_version" --ignore-scripts --no-audit --no-fund
          fi
          test "$(npm --version)" = "$npm_version"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build Stencil library
        run: npm run build

      - name: Build Storybook
        run: npx storybook build --output-dir storybook-static
        env:
          # GitHub Pages project sites live at /RepoName/ — Storybook
          # needs this so all asset paths resolve correctly.
          STORYBOOK_BASE_URL: /compomo/

      - name: Build component registry
        run: npm run registry:build

      - name: Copy registry into Storybook output
        run: cp -r public/r storybook-static/r

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.github/actions/retry-deploy-pages
