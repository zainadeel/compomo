name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      storybook: ${{ steps.scope.outputs.storybook }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-browser-scope.mjs >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Type-check Storybook tests
        run: npm run typecheck:storybook

      - name: Lint (warnings reported, not enforced)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload browser build
        if: ${{ steps.scope.outputs.browser == 'true' || steps.scope.outputs.storybook == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Validate agent contract
        run: npm run agent:validate

      - name: Verify component registry is current
        run: git diff --exit-code public/r

      - name: Unit tests
        run: npm test

      - name: Verify npm pack (nav + utils)
        run: npm run verify:pack

      - name: Verify dist artifacts
        run: |
          for f in \
            dist/components/index.js \
            dist/components/index.d.ts \
            dist/docs/components.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected output: $f"
              exit 1
            fi
          done
          echo "✅ All expected dist files present."

      - name: Verify src/ was not mutated by build
        run: |
          if [ -n "$(git status --porcelain src/)" ]; then
            echo "❌ Build mutated src/ — this should never happen:"
            git diff src/
            exit 1
          fi
          echo "✅ src/ is clean."

  e2e-contracts:
    name: Rendered browser contracts
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.browser == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Download browser build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-build
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Rendered browser contracts
        run: npm run test:e2e:pr

      - name: Upload rendered contract failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rendered-contract-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  storybook-a11y:
    name: Storybook accessibility
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.storybook == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Download browser build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-build
          path: dist

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Storybook accessibility tests
        run: npm run storybook:test:a11y

      - name: Upload accessibility failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storybook-accessibility-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
