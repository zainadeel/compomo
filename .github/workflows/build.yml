name: Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-browser-scope.mjs >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Type-check Storybook tests
        run: npm run typecheck:storybook

      - name: Lint (warnings reported, not enforced)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload browser build
        if: ${{ steps.scope.outputs.browser == 'true' && !startsWith(github.head_ref, 'release-please--') }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Validate agent contract
        run: npm run agent:validate

      - name: Verify component registry is current
        run: git diff --exit-code public/r

      - name: Unit tests
        run: npm test

      - name: Verify npm pack (nav + utils)
        run: npm run verify:pack

      - name: Verify dist artifacts
        run: |
          for f in \
            dist/components/index.js \
            dist/components/index.d.ts \
            dist/docs/components.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected output: $f"
              exit 1
            fi
          done
          echo "✅ All expected dist files present."

      - name: Verify src/ was not mutated by build
        run: |
          if [ -n "$(git status --porcelain src/)" ]; then
            echo "❌ Build mutated src/ — this should never happen:"
            git diff src/
            exit 1
          fi
          echo "✅ src/ is clean."

  e2e-chromium:
    name: Chromium rendered tests
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.browser == 'true' && !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download browser build
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: dist

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Chromium rendered tests
        run: npm run test:e2e:chromium

      - name: Upload Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-cross-browser:
    name: Firefox and WebKit contracts
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.browser == 'true' && !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download browser build
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: dist

      - name: Install Firefox and WebKit
        run: npx playwright install firefox webkit --with-deps

      - name: Cross-browser rendered contracts
        run: npx playwright test --project=firefox --project=webkit

      - name: Upload cross-browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  storybook-a11y:
    name: Storybook accessibility
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.browser == 'true' && !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download browser build
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: dist

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Storybook accessibility tests
        run: npm run storybook:test:a11y

      - name: Upload accessibility failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-accessibility-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
