name: Release Please

on:
  push:
    branches: [main]
  # Recovery path: re-run only the publish step against an existing tag,
  # e.g. if release-please created the tag + GH Release but errored before
  # the publish job could run. Skips the release-please job entirely.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish to npm (e.g. v1.2.3). Recovery only — skips release-please.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    name: Open / update release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm (OIDC)
    needs: release-please
    # Run when:
    #  - push: release-please created a release this run, OR
    #  - workflow_dispatch: operator is recovering a previously-tagged release.
    # `always()` is required so this job still evaluates when release-please was
    # skipped (workflow_dispatch path) instead of inheriting its skipped state.
    if: |
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publisher
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # Keep setup inline so recovery works for tags predating the local setup action.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Select pinned npm
        shell: bash
        run: |
          npm_version="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { packageManager } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const match = /^npm@(\d+\.\d+\.\d+)$/.exec(packageManager ?? '');
          if (!match) throw new Error('packageManager must pin an exact npm version');
          process.stdout.write(match[1]);
          NODE
          )"
          if [ "$(npm --version)" != "$npm_version" ]; then
            npm install --global "npm@$npm_version" --ignore-scripts --no-audit --no-fund
          fi
          test "$(npm --version)" = "$npm_version"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  deploy-pages:
    name: Deploy Storybook to GitHub Pages
    needs: [release-please, publish]
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-storybook.yml
    with:
      ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
