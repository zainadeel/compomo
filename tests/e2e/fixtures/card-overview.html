<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overview card</title>
    <link rel="stylesheet" href="/tokens/index.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: var(--typography-font-family-ui, system-ui);
      }

      ds-card-overview {
        display: block;
        width: 960px;
        max-width: 100%;
        margin-block-end: 24px;
      }

      #wrapped {
        width: 560px;
      }

      #stacked {
        width: 640px;
      }
    </style>
  </head>
  <body>
    <ds-card-overview id="default" period-label="Jul 27" comparison-label="vs.">
      <ds-select id="default-filter" slot="filter" aria-label="Comparison window"></ds-select>
    </ds-card-overview>

    <ds-card-overview id="range" comparison-label="vs.">
      <ds-select id="range-period" slot="period" aria-label="Current date range"></ds-select>
      <ds-select id="range-filter" slot="filter" aria-label="Comparison window"></ds-select>
    </ds-card-overview>

    <ds-card-overview id="wrapped" period-label="Jul 27" comparison-label="vs."></ds-card-overview>
    <ds-card-overview
      id="stacked"
      layout="stacked"
      period-label="Jul 27"
      comparison-label="vs."
    ></ds-card-overview>
    <ds-card-overview
      id="compact"
      variant="compact"
      period-label="Jul 27"
      comparison-label="vs."
    >
      <ds-select id="compact-filter" slot="filter" aria-label="Comparison window"></ds-select>
    </ds-card-overview>
    <ds-card-overview
      id="scroll-collapse"
      period-label="Jul 27"
      comparison-label="vs."
    ></ds-card-overview>
    <ds-card-overview id="fair"></ds-card-overview>
    <ds-card-overview id="good"></ds-card-overview>
    <ds-card-overview id="excellent"></ds-card-overview>
    <ds-card-overview id="no-score"></ds-card-overview>
    <ds-card-overview id="no-trend"></ds-card-overview>
    <ds-card-overview id="score-error" score-error-message="Score unavailable"></ds-card-overview>
    <ds-card-overview
      id="loading-overview"
      period-label="Jul 27"
      comparison-label="vs."
      is-loading
    >
      <ds-select id="loading-filter" slot="filter" aria-label="Comparison window"></ds-select>
    </ds-card-overview>
    <ds-card-overview id="loading-with-metrics" is-loading></ds-card-overview>

    <script type="module" src="/card-overview-setup.mjs"></script>
  </body>
</html>
