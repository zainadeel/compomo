<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Tag e2e</title>
    <link rel="stylesheet" href="/tokens/index.css">
  </head>
  <body>
    <main>
      <h1>Tag test</h1>
      <ds-tag id="tag" label="Active vehicle" intent="positive" contrast="faint"></ds-tag>
      <ds-tag
        id="icon-tag"
        label="Fleet"
        icon="VehicleTruck"
        intent="brand"
        contrast="medium"
      ></ds-tag>
      <ds-tag
        id="long-tag"
        label="A very long static metadata value that must truncate"
        max-width="120px"
      ></ds-tag>
      <ds-tag
        id="interactive-tag"
        label="Vehicle status"
        icon="Filters"
        interactive
        aria-controls="vehicle-status-menu"
      ></ds-tag>
      <div id="vehicle-status-menu" role="menu" hidden>
        <button type="button" role="menuitem">Active</button>
      </div>
      <ds-tag
        id="inactive-tag"
        label="Unavailable"
        interactive
        is-inactive
        aria-controls="unavailable-menu"
      ></ds-tag>
      <div id="unavailable-menu" role="menu" hidden></div>
      <div id="inset-tags">
        <ds-tag id="default-md" label="Default md" icon="VehicleTruck" size="md"></ds-tag>
        <ds-tag id="inset-md" label="Inset md" icon="VehicleTruck" size="md" is-inset></ds-tag>
        <ds-tag id="double-inset-md" label="Double inset md" icon="VehicleTruck" size="md" is-inset inset-depth="double"></ds-tag>
        <ds-tag id="default-sm" label="Default sm" icon="VehicleTruck" size="sm"></ds-tag>
        <ds-tag id="inset-sm" label="Inset sm" icon="VehicleTruck" size="sm" is-inset></ds-tag>
        <ds-tag id="double-inset-sm" label="Double inset sm" icon="VehicleTruck" size="sm" is-inset inset-depth="double"></ds-tag>
        <ds-tag id="default-xs" label="Default xs" icon="VehicleTruck" size="xs"></ds-tag>
        <ds-tag id="inset-xs" label="Inset xs" icon="VehicleTruck" size="xs" is-inset></ds-tag>
        <ds-tag id="double-inset-xs" label="Double inset xs" icon="VehicleTruck" size="xs" is-inset inset-depth="double"></ds-tag>
      </div>
      <div id="rounded-count-tags">
        <ds-tag id="count-default-md" label="1" size="md" rounded></ds-tag>
        <ds-tag id="count-inset-md" label="1" size="md" rounded is-inset></ds-tag>
        <ds-tag id="count-double-md" label="1" size="md" rounded is-inset inset-depth="double"></ds-tag>
        <ds-tag id="count-default-sm" label="1" size="sm" rounded></ds-tag>
        <ds-tag id="count-inset-sm" label="1" size="sm" rounded is-inset></ds-tag>
        <ds-tag id="count-double-sm" label="1" size="sm" rounded is-inset inset-depth="double"></ds-tag>
        <ds-tag id="count-default-xs" label="1" size="xs" rounded></ds-tag>
        <ds-tag id="count-inset-xs" label="1" size="xs" rounded is-inset></ds-tag>
        <ds-tag id="count-double-xs" label="1" size="xs" rounded is-inset inset-depth="double"></ds-tag>
      </div>
      <div id="matrix"></div>
    </main>
    <script type="module" src="/tag-setup.mjs"></script>
  </body>
</html>
