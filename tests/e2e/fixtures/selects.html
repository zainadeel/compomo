<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select foundations test</title>
    <link rel="stylesheet" href="/tokens/index.css" />
    <style>
      .contained-selects {
        contain: layout;
        overflow: hidden;
        width: 480px;
        height: 48px;
        margin: 96px 0 0 160px;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Select foundations test</h1>

      <ds-select id="single" aria-label="Fruit"></ds-select>
      <ds-select id="collapsible-single" icon="Chart" collapse-label aria-label="Collapsible fruit"></ds-select>
      <ds-select id="searchable" searchable aria-label="Search fruit"></ds-select>
      <ds-select id="loading" icon="Chart" is-loading aria-label="Loading fruit"></ds-select>
      <ds-select id="surface" background="bold" aria-label="Bold fruit"></ds-select>
      <ds-select
        id="borderless-error"
        error
        error-message="Choose a valid fruit"
        aria-label="Invalid borderless fruit"
      ></ds-select>
      <ds-select
        id="multi"
        multiple
        name="entities"
        placeholder="Entities"
        aria-label="Entities"
      ></ds-select>
      <ds-select
        id="multi-search"
        multiple
        searchable
        placeholder="Entities"
        aria-label="Search entities"
      ></ds-select>
      <ds-filter-menu
        id="filters"
        trigger-label="Filters"
        aria-label="Filter records"
        menu-label="Filter records"
      ></ds-filter-menu>
      <ds-filter-menu
        id="collapsible-filters"
        icon="Filter"
        collapse-label
        trigger-label="Filters"
        aria-label="Collapsible filters"
      ></ds-filter-menu>
      <div id="shadow-select-host"></div>
      <div id="shadow-filter-anchor-host"></div>
      <ds-filter-menu
        id="shadow-external-filters"
        menu-label="External filters"
      ></ds-filter-menu>

      <form id="selection-form">
        <ds-select
          id="required-single"
          name="fruit"
          required
          aria-label="Required fruit"
        ></ds-select>
        <ds-select
          id="required-multi"
          multiple
          name="group"
          required
          placeholder="Groups"
          aria-label="Required groups"
        ></ds-select>
        <button id="submit" type="submit">Submit</button>
        <button id="reset" type="reset">Reset</button>
      </form>

      <section class="contained-selects" aria-label="Contained select fixtures">
        <ds-select id="contained-single" aria-label="Contained fruit"></ds-select>
        <ds-select
          id="contained-multi"
          multiple
          placeholder="Contained entities"
          aria-label="Contained entities"
        ></ds-select>
      </section>
    </main>

    <script type="module" src="/selects-setup.mjs"></script>
  </body>
</html>
