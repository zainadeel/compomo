<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>App shell chrome e2e</title>
    <link rel="stylesheet" href="/tokens/index.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: var(--typography-font-family-ui, system-ui);
        background: var(--color-background-primary);
      }
      ds-shell-app {
        width: 1280px;
        height: 720px;
      }
    </style>
  </head>
  <body>
    <ds-shell-app composition="slotted" gradient>
      <ds-panel-nav slot="panel" id="panel" router-mode="event"></ds-panel-nav>
      <ds-bar-nav slot="bar" id="bar"></ds-bar-nav>
      <ds-panel-tools slot="tools" id="tools" storage-key="e2e.panel-tools.last-tool">
        <ds-text slot="agents" variant="text-body-medium" color="secondary">Agents panel</ds-text>
        <section slot="agents-view" id="agents-full-view">Agents full view</section>
        <ds-text slot="help" variant="text-body-medium" color="secondary">Help panel</ds-text>
      </ds-panel-tools>
      <main style="position:relative;min-height:100%">
        Page content
        <button id="page-edge-menu-trigger" type="button" style="position:absolute;right:8px;top:80px">
          Page actions
        </button>
      </main>
    </ds-shell-app>
    <ds-menu id="agents-options-menu" menu-label="Agents options"></ds-menu>
    <ds-menu id="account-menu" menu-label="Account appearance"></ds-menu>
    <ds-menu id="page-edge-menu" menu-label="Page actions" menu-width="320px"></ds-menu>
    <script type="module" src="/shell-app-chrome-setup.mjs"></script>
  </body>
</html>
