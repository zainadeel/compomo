<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Button loading e2e</title>
    <link rel="stylesheet" href="/tokens/index.css">
  </head>
  <body>
    <main>
      <h1>Button loading test</h1>
      <ds-button-filled id="filled-label" variant="label" label="Save"></ds-button-filled>
      <ds-button-filled id="filled-short-label" variant="label" label="/"></ds-button-filled>
      <ds-button-filled id="filled-short-label-inset" variant="label" label="/" is-inset></ds-button-filled>
      <ds-button-filled id="filled-icon" variant="icon" icon="Check" aria-label="Save"></ds-button-filled>
      <ds-button-filled id="filled-icon-label" variant="icon-label" icon="Check" label="Save"></ds-button-filled>
      <ds-button-filled id="filled-lg" size="lg" variant="icon-label" icon="Check" label="Large"></ds-button-filled>
      <ds-button-filled id="filled-inset-md" size="md" variant="icon" icon="Check" aria-label="Inset primary" is-inset></ds-button-filled>
      <ds-button-filled id="filled-double-inset-md" size="md" variant="icon" icon="Check" aria-label="Double inset primary" is-inset inset-depth="double"></ds-button-filled>
      <ds-button-filled id="filled-bordered" label="Confirm" has-border background="medium"></ds-button-filled>
      <ds-button-unfilled id="unfilled-label" variant="label" label="Cancel"></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-short-label" variant="label" label="/"></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-short-label-inset" variant="label" label="/" is-inset></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-icon" variant="icon" icon="Close" aria-label="Cancel"></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-icon-label" variant="icon-label" icon="Close" label="Cancel"></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-collapsible-label" variant="icon-label" icon="Close" label="Collapsible" collapse-label></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-inset-md" size="md" variant="icon" icon="Close" aria-label="Inset secondary" is-inset></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-double-inset-md" size="md" variant="icon" icon="Close" aria-label="Double inset secondary" is-inset inset-depth="double"></ds-button-unfilled>
      <ds-button-unfilled id="unfilled-no-press-scale" label="Stable" press-scale="false"></ds-button-unfilled>
      <ds-button-filled id="filled-inactive" label="Unavailable" is-inactive></ds-button-filled>
      <ds-button-unfilled id="unfilled-inactive" label="Unavailable" is-inactive></ds-button-unfilled>
      <section id="split-buttons" aria-label="Split buttons">
        <ds-button-filled id="filled-split-label" split label="Create" menu-aria-label="More create options"></ds-button-filled>
        <ds-button-filled id="filled-split-icon" split variant="icon" icon="Plus" aria-label="Create" menu-aria-label="More create options"></ds-button-filled>
        <ds-button-filled id="filled-split-icon-label" split variant="icon-label" icon="Plus" label="Create" menu-aria-label="More create options"></ds-button-filled>
        <ds-button-filled id="filled-split-rounded" split rounded label="Create" menu-aria-label="More rounded create options"></ds-button-filled>
        <ds-button-filled id="filled-split-loading" split label="Create" menu-aria-label="More loading options" is-loading></ds-button-filled>
        <ds-button-unfilled id="unfilled-split-label" split label="Export" menu-aria-label="More export options"></ds-button-unfilled>
        <ds-button-unfilled id="unfilled-split-icon" split variant="icon" icon="Export" aria-label="Export" menu-aria-label="More export options"></ds-button-unfilled>
        <ds-button-unfilled id="unfilled-split-icon-label" split variant="icon-label" icon="Export" label="Export" menu-aria-label="More export options"></ds-button-unfilled>
        <ds-button-unfilled id="unfilled-split-rounded" split rounded label="Export" menu-aria-label="More rounded export options"></ds-button-unfilled>
        <ds-button-unfilled id="unfilled-split-borderless" split label="Export" menu-aria-label="More borderless export options" has-border="false"></ds-button-unfilled>
      </section>
      <div id="hug-column" style="display:flex;flex-direction:column;align-items:stretch;width:240px;">
        <ds-button-filled id="filled-hug-column" label="Primary hug"></ds-button-filled>
        <ds-button-unfilled id="unfilled-hug-column" label="Secondary hug"></ds-button-unfilled>
      </div>
      <div id="hug-centered-row" style="display:flex;align-items:center;height:120px;width:240px;">
        <ds-tooltip label="Primary action" side="bottom" size="sm">
          <ds-button-filled id="filled-centered" variant="icon" icon="Check" aria-label="Primary action"></ds-button-filled>
        </ds-tooltip>
        <ds-tooltip label="Secondary action" side="bottom" size="sm">
          <ds-button-unfilled id="unfilled-centered" variant="icon" icon="Close" aria-label="Secondary action"></ds-button-unfilled>
        </ds-tooltip>
      </div>
      <form id="button-form">
        <label for="form-value">Form value</label>
        <input id="form-value" name="value" value="initial">
        <ds-button-filled id="filled-submit" label="Submit primary" type="submit"></ds-button-filled>
        <ds-button-unfilled id="unfilled-submit" label="Submit secondary" type="submit"></ds-button-unfilled>
        <ds-button-unfilled id="unfilled-reset" label="Reset" type="reset"></ds-button-unfilled>
      </form>
    </main>
    <script type="module" src="/buttons-setup.mjs"></script>
  </body>
</html>
