<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings cards</title>
    <link rel="stylesheet" href="/tokens/index.css" />
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <ds-card-setting
        id="general-card"
        heading="General"
        card-width="sm"
        edit-label="Edit General"
        cancel-label="Cancel General"
        save-label="Save General"
      >
        <p>Organization settings.</p>
      </ds-card-setting>

      <ds-card-setting
        id="drivers-card"
        heading="Driver identification"
        card-width="sm"
        edit-label="Edit Driver identification"
        cancel-label="Cancel Driver identification"
        save-label="Save Driver identification"
      >
        <p>Driver identification settings.</p>
      </ds-card-setting>
      <ds-card-setting
        id="immediate-card"
        heading="Interface preferences"
        variant="immediate"
        editing
      >
        <div role="list" aria-label="Interface preferences">
          <ds-setting-row-toggle
            id="navigation-setting"
            role="listitem"
            label="Panel navigation"
            description="Show page sections in the side panel. Turn off to use top bar tabs."
            checked
          ></ds-setting-row-toggle>
          <ds-setting-row-toggle
            id="long-setting"
            role="listitem"
            label="Configuration menus with a longer setting name"
            description="Open filters and view settings in menus. Turn off to use a right-side configuration panel beside the page."
            variant="non-emphasis"
            checked
          ></ds-setting-row-toggle>
          <ds-setting-row-toggle
            id="disabled-setting"
            role="listitem"
            label="Unavailable setting"
            description="This setting is managed by your organization."
            disabled
            checked
          ></ds-setting-row-toggle>
        </div>
      </ds-card-setting>
    </main>

    <script type="module" src="/card-setting-setup.mjs"></script>
  </body>
</html>
